<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
        width: 100%;
        max-width: 500px;
        padding: 18px;
        box-sizing: border-box;
    }

    .title {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 14px;
    }

    .bar {
        width: 100%;
        height: 14px;
        background: #e9e9e9;
        border-radius: 10px;
        overflow: hidden;
    }

    .progress {
        height: 100%;
        background: #111111;
        border-radius: 10px;
        transition: width 0.5s ease;
    }

    .stats {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
        font-size: 13px;
        color: #777;
    }

    .percent {
        font-weight: 600;
        color: #111;
    }
</style>
</head>

<body>

<div class="container">
    <div class="title">📚 FALL 2026 SEMESTER</div>

    <div class="bar">
        <div class="progress" id="progress"></div>
    </div>

    <div class="stats">
        <span id="days"></span>
        <span class="percent" id="percent"></span>
    </div>
</div>

<script>

const startDate = new Date("2026-09-09T00:00:00");
const endDate   = new Date("2026-12-23T23:59:59");

const now = new Date();

const totalDays = (endDate - startDate) / (1000 * 60 * 60 * 24);

let completedDays = (now - startDate) / (1000 * 60 * 60 * 24);

completedDays = Math.max(0, Math.min(completedDays, totalDays));

const percentage = Math.round((completedDays / totalDays) * 100);

document.getElementById("progress").style.width = percentage + "%";

document.getElementById("days").textContent =
    Math.floor(completedDays) + " days completed • " +
    Math.ceil(totalDays - completedDays) + " days remaining";

document.getElementById("percent").textContent =
    percentage + "%";

</script>

</body>
</html>
